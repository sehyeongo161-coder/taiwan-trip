<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장금지원하민 대만여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; background-color: #f8fafc; display: flex; justify-content: center; font-family: sans-serif; }
        button, a, div { -webkit-tap-highlight-color: transparent; outline: none; }
        .edit-input { width: 100%; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 4px; padding: 4px 6px; font-size: inherit; font-family: inherit; color: inherit; font-weight: inherit; transition: all 0.2s; }
        .edit-input:focus { outline: 2px solid #a855f7; border-color: transparent; background: white; }
        .modal-bg { transition: opacity 0.3s ease-out; }
        .modal-content { transition: transform 0.3s ease-out; }
        #loading-screen { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; color: #a855f7; font-weight: bold; flex-direction: column; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="animate-bounce mb-4 text-4xl">🇹🇼</div>
        <div>데이터 동기화 중...</div>
    </div>

    <div class="w-full max-w-md bg-[#FAFAFA] min-h-screen shadow-2xl relative pb-24 overflow-x-hidden">
        <!-- 보라색 테마 헤더 -->
        <header class="bg-gradient-to-br from-purple-100 via-violet-50 to-indigo-50 px-6 pt-12 pb-8 rounded-b-[40px] shadow-sm relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
            <div class="absolute top-10 -left-10 w-32 h-32 bg-indigo-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
            
            <div class="relative z-10 flex justify-between items-start">
                <div>
                    <div class="flex items-center text-purple-600 mb-2">
                        <i data-lucide="palmtree" class="w-[18px] h-[18px] text-purple-600 mr-2"></i>
                        <span class="text-sm font-semibold tracking-wider">TAIWAN TRIP</span>
                        <span id="dday-badge" class="ml-2 px-2.5 py-0.5 bg-purple-600 text-white text-xs font-bold rounded-full shadow-sm">계산중...</span>
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-800 leading-tight">장금지원하민<br />대만 여행</h1>
                </div>
                <div class="flex items-center space-x-2 mt-2">
                    <button id="undo-btn" class="bg-white/80 p-2 rounded-full shadow-sm text-gray-400 hover:text-indigo-500 transition-colors backdrop-blur-sm disabled:opacity-30 disabled:hover:text-gray-400" onclick="window.undoAction()" disabled>
                        <i data-lucide="undo-2" class="w-5 h-5"></i>
                    </button>
                    <button id="edit-toggle-btn" class="bg-white/80 p-2 rounded-full shadow-sm text-gray-600 hover:text-purple-600 transition-colors backdrop-blur-sm" onclick="window.toggleEditMode()">
                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="edit-notice" class="hidden mt-4 text-xs font-bold text-purple-600 bg-white/70 px-3 py-2 rounded-lg backdrop-blur-sm shadow-sm text-center">
                ✏️ 편집 모드: 수정 완료 후 꼭 우측 상단 체크(✔) 버튼을 누르세요!
            </div>
        </header>

        <main class="px-5 -mt-4 relative z-20">
            <div id="itinerary-view">
                <div id="trip-container"></div>
                <!-- 하단 구글맵 버튼도 대만으로 변경 -->
                <a href="https://www.google.com/maps/search/타이베이+시먼딩+맛집" target="_blank" class="block mt-4 mb-8 bg-indigo-50 border border-indigo-100 rounded-2xl p-5 flex items-start space-x-4 shadow-sm hover:bg-indigo-100 transition-colors">
                    <div class="bg-indigo-200 p-3 rounded-full text-indigo-600 flex-shrink-0"><i data-lucide="map-pin" class="w-6 h-6"></i></div>
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm mb-1 flex items-center">대만 여행 꿀팁 <i data-lucide="info" class="w-3 h-3 ml-1 text-indigo-500"></i></h4>
                        <p class="text-xs text-gray-600 leading-relaxed">현지에서 <strong class="text-indigo-600">이지카드</strong> 충전은 필수! 시먼딩 마라훠궈는 미리 예약하세요.</p>
                    </div>
                </a>
            </div>

            <div id="checklist-view" class="hidden pb-8">
                <div id="checklist-container" class="bg-white rounded-3xl shadow-sm border border-purple-50/50 p-5 mt-2"></div>
            </div>
        </main>

        <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 p-4 flex justify-around items-center text-gray-400 pb-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50">
            <button id="nav-itinerary" class="flex flex-col items-center text-purple-600 transition-colors" onclick="window.switchTab('itinerary')"><i data-lucide="calendar-days" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">일정표</span></button>
            <button id="nav-checklist" class="flex flex-col items-center hover:text-gray-800 transition-colors" onclick="window.switchTab('checklist')"><i data-lucide="list-todo" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">체크리스트</span></button>
            <a href="https://www.google.com/maps/search/타이베이+맛집" target="_blank" class="flex flex-col items-center hover:text-gray-800 transition-colors"><i data-lucide="map" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">지도 검색</span></a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC56qGPGXTnYBpQNdrdv2gt6TlkPvzTz-8",
            authDomain: "kitakyushu-trip.firebaseapp.com",
            projectId: "kitakyushu-trip",
            storageBucket: "kitakyushu-trip.firebasestorage.app",
            messagingSenderId: "883462812612",
            appId: "1:883462812612:web:ebb0479fcafb1c807f2a91"
        };
        
        let app, db;

        // 대만 여행 날짜: 2026년 5월 16일 (시스템 날짜 4월 기준)
        function updateDday() {
            const dday = new Date(2026, 4, 16); // 5월은 0부터 시작하므로 4
            const today = new Date();
            today.setHours(0, 0, 0, 0); 
            const diffTime = dday.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let text = "";
            if (diffDays > 0) text = `D-${diffDays}`;
            else if (diffDays === 0) text = `D-Day 🇹🇼`;
            else text = `D+${Math.abs(diffDays)}`;
            document.getElementById('dday-badge').innerText = text;
        }

        // 대만 일정으로 대충 짜집기
        const defaultData = [
            { id: 1, day: "1일차", date: "5월 16일", theme: "타이베이 입성 & 시먼딩 투어", activities: [{ id: 101, time: "오전", title: "공항 ➔ 타이베이 시내", type: "bus", desc: "국광버스 타고 이동!", mapUrl: "", memo: "" }, { id: 102, time: "저녁", title: "시먼딩 마라훠궈", type: "utensils", desc: "무한리필 뿌시기", mapUrl: "", memo: "" }] },
            { id: 2, day: "2일차", date: "5월 17일", theme: "예스진지 택시투어", activities: [{ id: 201, time: "오후", title: "지우펀 홍등가 🏮", type: "camera", desc: "인생샷 남기기", mapUrl: "", memo: "" }] },
            { id: 3, day: "3일차", date: "5월 18일", theme: "용캉제 & 마지막 쇼핑", activities: [{ id: 301, time: "오후", title: "까르푸 & 귀국", type: "shopping-bag", desc: "누가크래커 사기", mapUrl: "", memo: "" }] }
        ];

        const defaultChecklist = [
            { id: "c1", text: "여권 & 이비자 확인", checked: false },
            { id: "c2", text: "이지카드(교통카드)", checked: false },
            { id: "c3", text: "돼지코(어댑터)", checked: false }
        ];

        let tripData = [];
        let checklistData = [];
        let openDays = [1, 2, 3]; 
        let expandedMemos = {}; 
        let isEditMode = false;
        let currentTab = 'itinerary';
        let historyStack = []; 

        // 보라색 테마에 맞는 아이콘 색상들
        const iconTypes = ['heart', 'plane', 'bus', 'train-front', 'utensils', 'music', 'shopping-bag', 'camera', 'coffee', 'map-pin'];
        const getIconColor = (type) => {
            switch (type) {
                case 'plane': return 'text-blue-500'; case 'bus': return 'text-emerald-500'; case 'train-front': return 'text-indigo-500'; case 'utensils': return 'text-orange-500'; case 'music': return 'text-purple-500'; case 'shopping-bag': return 'text-purple-500'; case 'camera': return 'text-teal-500'; case 'coffee': return 'text-amber-600'; case 'map-pin': return 'text-red-500'; default: return 'text-purple-400';
            }
        };

        function hideLoadingScreen() {
            const ls = document.getElementById('loading-screen');
            if (ls) ls.style.display = 'none';
        }

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                // 저장 경로도 taiwan-trip으로 바꿔서 기존꺼 안날라가게 함
                const docRef = doc(db, 'trips', 'taiwan-trip'); 
                
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.tripData) tripData = JSON.parse(data.tripData);
                        if (data.checklistData) checklistData = JSON.parse(data.checklistData);
                        render();
                    } else {
                        tripData = JSON.parse(JSON.stringify(defaultData));
                        checklistData = JSON.parse(JSON.stringify(defaultChecklist));
                        saveData();
                    }
                    hideLoadingScreen();
                }, (error) => {
                    console.error("데이터 동기화 에러:", error);
                    hideLoadingScreen();
                });
            } catch (e) {
                console.error("Firebase 초기화 에러:", e);
                hideLoadingScreen();
            }
        }

        async function saveData() {
            try {
                const docRef = doc(db, 'trips', 'taiwan-trip');
                await setDoc(docRef, {
                    tripData: JSON.stringify(tripData),
                    checklistData: JSON.stringify(checklistData)
                });
            } catch (e) { console.error("데이터 저장 실패:", e); }
        }

        function saveHistory() {
            historyStack.push({ tripData: JSON.parse(JSON.stringify(tripData)), checklistData: JSON.parse(JSON.stringify(checklistData)) });
            if(historyStack.length > 20) historyStack.shift(); 
            updateUndoButtonState();
        }

        function updateUndoButtonState() {
            const btn = document.getElementById('undo-btn');
            if (historyStack.length > 0) { btn.removeAttribute('disabled'); btn.classList.add('text-indigo-500'); btn.classList.remove('text-gray-400'); } 
            else { btn.setAttribute('disabled', 'true'); btn.classList.remove('text-indigo-500'); btn.classList.add('text-gray-400'); }
        }

        window.undoAction = function() {
            if (historyStack.length === 0) return;
            const prevState = historyStack.pop();
            tripData = prevState.tripData; checklistData = prevState.checklistData;
            saveData(); updateUndoButtonState(); render();
        };

        window.switchTab = function(tab) { currentTab = tab; window.scrollTo(0,0); render(); };

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            expandedMemos = {};
            const btn = document.getElementById('edit-toggle-btn');
            const notice = document.getElementById('edit-notice');
            
            if (isEditMode) {
                btn.classList.add('bg-purple-100', 'text-purple-600'); btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>'; notice.classList.remove('hidden');
            } else {
                btn.classList.remove('bg-purple-100', 'text-purple-600'); btn.innerHTML = '<i data-lucide="edit-3" class="w-5 h-5"></i>'; notice.classList.add('hidden');
                saveData(); 
            }
            lucide.createIcons(); render();
        };

        window.toggleDay = function(id) {
            if (openDays.includes(id)) { openDays = openDays.filter(dayId => dayId !== id); } else { openDays.push(id); }
            render();
        };

        window.updateData = function(dayId, activityId, field, value) {
            const day = tripData.find(d => String(d.id) === String(dayId));
            if(!day) return;
            let oldValue;
            if (activityId === null) { oldValue = day[field]; } else { const activity = day.activities.find(a => String(a.id) === String(activityId)); if(activity) oldValue = activity[field]; }
            if (oldValue !== value) {
                saveHistory(); 
                if (activityId === null) { day[field] = value; } else { const activity = day.activities.find(a => String(a.id) === String(activityId)); if(activity) activity[field] = value; }
                saveData(); 
            }
        };

        window.deleteActivity = function(dayId, activityId) {
            saveHistory(); const day = tripData.find(d => String(d.id) === String(dayId));
            if(day) { day.activities = day.activities.filter(a => String(a.id) !== String(activityId)); saveData(); render(); }
        };

        window.moveActivity = function(dayId, activityId, direction) {
            const day = tripData.find(d => String(d.id) === String(dayId)); if(!day) return;
            const index = day.activities.findIndex(a => String(a.id) === String(activityId)); if (index < 0) return;
            const newIndex = index + direction; if (newIndex < 0 || newIndex >= day.activities.length) return;
            saveHistory(); const temp = day.activities[index]; day.activities[index] = day.activities[newIndex]; day.activities[newIndex] = temp;
            saveData(); render();
        };

        window.addActivity = function(dayId) {
            const day = tripData.find(d => String(d.id) === String(dayId)); if(!day) return;
            saveHistory(); const newId = Date.now();
            day.activities.push({ id: newId, time: "시간", title: "새로운 일정", type: "heart", desc: "", mapUrl: "", memo: "" });
            saveData(); if (!openDays.includes(dayId)) openDays.push(dayId); render();
        };

        window.changeIcon = function(dayId, activityId) {
            if(!isEditMode) return; const day = tripData.find(d => String(d.id) === String(dayId)); const activity = day.activities.find(a => String(a.id) === String(activityId)); if(!activity) return;
            saveHistory(); const currentIndex = iconTypes.indexOf(activity.type); const nextIndex = (currentIndex + 1) % iconTypes.length; activity.type = iconTypes[nextIndex];
            saveData(); render();
        };

        window.toggleMemo = function(e, actId, state) {
            if (e) e.stopPropagation();
            if (expandedMemos[actId] === state) { delete expandedMemos[actId]; } else { expandedMemos[actId] = state; }
            render();
        };

        window.saveInlineMemo = function(e, dayId, actId) {
            if (e) e.stopPropagation();
            const textarea = document.getElementById(`memo-input-${actId}`);
            if (!textarea) return;
            const day = tripData.find(d => String(d.id) === String(dayId));
            const act = day.activities.find(a => String(a.id) === String(actId));
            if (act) {
                if (act.memo !== textarea.value) { saveHistory(); act.memo = textarea.value; saveData(); }
                expandedMemos[actId] = 'view';
                render();
            }
        };

        window.toggleChecklistItem = function(id) {
            if (isEditMode) return; saveHistory(); const item = checklistData.find(i => String(i.id) === String(id)); if (item) item.checked = !item.checked; saveData(); render();
        };

        window.updateChecklistData = function(id, value) {
            const item = checklistData.find(i => String(i.id) === String(id)); if (!item || item.text === value) return; saveHistory(); item.text = value; saveData();
        };

        window.deleteChecklistItem = function(id) { saveHistory(); checklistData = checklistData.filter(i => String(i.id) !== String(id)); saveData(); render(); };

        window.moveChecklistItem = function(id, direction) {
            const index = checklistData.findIndex(i => String(i.id) === String(id)); if (index < 0) return;
            const newIndex = index + direction; if (newIndex < 0 || newIndex >= checklistData.length) return;
            saveHistory(); const temp = checklistData[index]; checklistData[index] = checklistData[newIndex]; checklistData[newIndex] = temp; saveData(); render();
        };

        window.addChecklistItem = function() { saveHistory(); checklistData.push({ id: 'c' + Date.now(), text: "", checked: false }); saveData(); render(); };

        function render() {
            document.getElementById('itinerary-view').style.display = currentTab === 'itinerary' ? 'block' : 'none';
            document.getElementById('checklist-view').style.display = currentTab === 'checklist' ? 'block' : 'none';
            
            const navItin = document.getElementById('nav-itinerary'); const navCheck = document.getElementById('nav-checklist');
            if (currentTab === 'itinerary') { navItin.classList.add('text-purple-600'); navItin.classList.remove('text-gray-400'); navCheck.classList.remove('text-purple-600'); navCheck.classList.add('text-gray-400'); } 
            else { navCheck.classList.add('text-purple-600'); navCheck.classList.remove('text-gray-400'); navItin.classList.remove('text-purple-600'); navItin.classList.add('text-gray-400'); }

            const checklistContainer = document.getElementById('checklist-container');
            let chkHtml = '<h2 class="text-xl font-bold text-gray-800 mb-5 flex items-center"><i data-lucide="list-todo" class="w-6 h-6 mr-2 text-purple-600"></i> 여행 체크리스트</h2><div class="space-y-3">';
            checklistData.forEach((item, index) => {
                const isFirst = index === 0; const isLast = index === checklistData.length - 1;
                if (isEditMode) {
                    chkHtml += `
                        <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200 shadow-sm">
                            <input type="text" class="edit-input flex-1 mr-3 text-base text-gray-800 font-medium" value="${item.text}" onchange="window.updateChecklistData('${item.id}', this.value)" placeholder="체크리스트 항목을 적어주세요">
                            <div class="flex items-center space-x-1 bg-white rounded-md px-1 shadow-sm border border-slate-200">
                                <button onclick="window.moveChecklistItem('${item.id}', -1)" class="text-gray-500 hover:text-indigo-500 p-1.5 disabled:opacity-20" ${isFirst ? 'disabled' : ''}><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                                <button onclick="window.moveChecklistItem('${item.id}', 1)" class="text-gray-500 hover:text-indigo-500 p-1.5 disabled:opacity-20" ${isLast ? 'disabled' : ''}><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                                <div class="w-[1px] h-4 bg-slate-200 mx-1"></div>
                                <button onclick="window.deleteChecklistItem('${item.id}')" class="text-red-400 hover:text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                } else {
                    const checkIcon = item.checked ? 'check-square' : 'square'; const textClass = item.checked ? 'text-gray-400 line-through' : 'text-gray-800 font-medium'; const iconColor = item.checked ? 'text-purple-500' : 'text-gray-300';
                    chkHtml += `
                        <div class="flex items-center p-3 rounded-xl hover:bg-purple-50/50 cursor-pointer transition-colors border border-transparent ${item.checked ? 'bg-slate-50' : 'bg-white shadow-sm border-slate-100'}" onclick="window.toggleChecklistItem('${item.id}')">
                            <i data-lucide="${checkIcon}" class="w-6 h-6 mr-3 ${iconColor} transition-colors flex-shrink-0"></i>
                            <span class="${textClass} transition-all text-base leading-tight">${item.text}</span>
                        </div>
                    `;
                }
            });
            chkHtml += '</div>';
            if (isEditMode) { chkHtml += `<button onclick="window.addChecklistItem()" class="w-full mt-5 py-3 border-2 border-dashed border-purple-200 text-purple-600 font-bold rounded-xl hover:bg-purple-50 hover:border-purple-300 transition-colors flex items-center justify-center"><i data-lucide="plus" class="w-5 h-5 mr-1"></i> 새 항목 추가</button>`; }
            checklistContainer.innerHTML = chkHtml;

            const container = document.getElementById('trip-container'); container.innerHTML = '';
            tripData.forEach(dayData => {
                const isOpen = openDays.includes(dayData.id); const card = document.createElement('div'); card.className = "bg-white rounded-3xl shadow-sm border border-purple-50/50 mb-4 overflow-hidden transition-all duration-300";
                const header = document.createElement('div'); header.className = "w-full flex items-center justify-between p-5 bg-gradient-to-r from-white to-purple-50/30 transition-colors";
                const themeHtml = isEditMode ? `<input type="text" class="edit-input mt-2 text-lg font-bold text-gray-800" value="${dayData.theme}" onchange="window.updateData('${dayData.id}', null, 'theme', this.value)">` : `<h3 class="mt-2 text-lg font-bold text-gray-800">${dayData.theme}</h3>`;
                header.innerHTML = `
                    <div class="flex flex-col items-start text-left w-[85%]">
                        <div class="flex items-center space-x-2"><span class="text-sm font-bold text-purple-600 bg-purple-100 px-3 py-1 rounded-full">${dayData.day}</span><span class="text-gray-500 text-sm font-medium">${dayData.date}</span></div>
                        ${themeHtml}
                    </div>
                    <button class="p-2 bg-white rounded-full shadow-sm text-gray-400 flex-shrink-0 ml-2 z-10 hover:text-purple-600" onclick="window.toggleDay('${dayData.id}')"><i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5"></i></button>
                `;
                if(!isEditMode) { header.onclick = () => window.toggleDay(dayData.id); header.classList.add('cursor-pointer'); }
                card.appendChild(header);

                if (isOpen) {
                    const body = document.createElement('div'); body.className = "px-5 pb-6 pt-2 bg-white";
                    const timelineList = document.createElement('div'); timelineList.className = "relative border-l-[1.5px] border-purple-100 ml-4 space-y-6 mt-4";

                    dayData.activities.forEach((act, index) => {
                        const isFirst = index === 0; const isLast = index === dayData.activities.length - 1; const item = document.createElement('div'); item.className = "relative pl-6";
                        const iconBg = isEditMode ? 'bg-white cursor-pointer hover:bg-slate-50 border border-slate-200 shadow-sm' : 'bg-white shadow-sm border border-purple-50';
                        const iconHtml = `
                            <div class="absolute -left-[17px] top-0 w-[34px] h-[34px] rounded-full flex items-center justify-center z-10 transition-colors ${iconBg}" ${isEditMode ? `onclick="window.changeIcon('${dayData.id}', '${act.id}')" title="아이콘 변경"` : ''}>
                                <i data-lucide="${act.type}" class="w-[18px] h-[18px] ${getIconColor(act.type)} fill-current opacity-20 absolute"></i>
                                <i data-lucide="${act.type}" class="w-4 h-4 ${getIconColor(act.type)} relative z-10"></i>
                            </div>
                        `;

                        if (isEditMode) {
                            item.innerHTML = `
                                ${iconHtml}
                                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 shadow-sm mb-2">
                                    <div class="flex gap-2 mb-2.5">
                                        <input type="text" class="edit-input w-20 text-sm font-bold text-purple-600 text-center" value="${act.time}" placeholder="시간" onchange="window.updateData('${dayData.id}', '${act.id}', 'time', this.value)">
                                        <input type="text" class="edit-input flex-1 font-bold text-gray-800" value="${act.title}" placeholder="일정 제목" onchange="window.updateData('${dayData.id}', '${act.id}', 'title', this.value)">
                                    </div>
                                    <input type="text" class="edit-input w-full text-xs text-gray-500 mb-2.5" value="${act.desc}" placeholder="간단한 설명 (선택)" onchange="window.updateData('${dayData.id}', '${act.id}', 'desc', this.value)">
                                    <input type="text" class="edit-input w-full text-[11px] text-blue-500 mb-2" value="${act.mapUrl || ''}" placeholder="구글맵 URL (선택)" onchange="window.updateData('${dayData.id}', '${act.id}', 'mapUrl', this.value)">
                                    <div class="flex justify-end items-center space-x-1 mt-3 bg-white p-1 rounded-lg w-max ml-auto border border-slate-100">
                                        <button onclick="window.moveActivity('${dayData.id}', '${act.id}', -1)" class="p-1.5 text-gray-400 hover:text-indigo-500 rounded-md disabled:opacity-20" ${isFirst ? 'disabled' : ''}><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
                                        <button onclick="window.moveActivity('${dayData.id}', '${act.id}', 1)" class="p-1.5 text-gray-400 hover:text-indigo-500 rounded-md disabled:opacity-20" ${isLast ? 'disabled' : ''}><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
                                        <div class="w-[1px] h-3 bg-slate-200 mx-1"></div>
                                        <button onclick="window.deleteActivity('${dayData.id}', '${act.id}')" class="p-1.5 text-red-400 hover:text-red-600 rounded-md"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            `;
                        } else {
                            const memoBadge = act.memo ? `<span class="absolute top-3 right-3 w-2 h-2 bg-purple-600 rounded-full ring-2 ring-white shadow-sm" title="메모 있음"></span>` : '';
                            const memoState = expandedMemos[act.id];
                            let memoHtml = '';
                            if (memoState) {
                                let mapBtnHtml = act.mapUrl ? `<a href="${act.mapUrl}" target="_blank" onclick="event.stopPropagation()" class="mt-2 mb-3 flex items-center justify-center w-full py-2 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg hover:bg-blue-100 transition-colors shadow-sm"><i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1.5"></i> 구글맵으로 위치 보기</a>` : '';
                                if (memoState === 'view') {
                                    memoHtml = `
                                        <div class="mt-3 pt-3 border-t border-gray-100/70" onclick="event.stopPropagation()">
                                            ${mapBtnHtml}
                                            <div class="flex justify-between items-center mb-1 px-1">
                                                <span class="text-xs font-bold text-gray-400 flex items-center"><i data-lucide="notebook-pen" class="w-3 h-3 mr-1"></i>상세 메모</span>
                                                <button onclick="window.toggleMemo(event, '${act.id}', 'edit')" class="text-gray-400 hover:text-purple-600 p-1.5 bg-gray-50 hover:bg-purple-50 rounded-md transition-colors" title="메모 수정"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                                            </div>
                                            <div class="bg-slate-50 rounded-xl p-3.5 mt-1.5 shadow-inner border border-slate-100/50">
                                                <p class="text-[13px] text-gray-700 whitespace-pre-wrap break-keep leading-relaxed">${act.memo ? act.memo : '<span class="text-gray-400 italic">작성된 메모가 없습니다.</span>'}</p>
                                            </div>
                                        </div>
                                    `;
                                } else if (memoState === 'edit') {
                                    memoHtml = `
                                        <div class="mt-3 pt-3 border-t border-gray-100/70" onclick="event.stopPropagation()">
                                            <div class="flex justify-between items-center mb-2 px-1">
                                                <span class="text-xs font-bold text-purple-600 flex items-center"><i data-lucide="pencil" class="w-3 h-3 mr-1"></i>메모 수정 중...</span>
                                            </div>
                                            <textarea id="memo-input-${act.id}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-[13px] text-gray-700 focus:outline-none focus:border-purple-300 focus:ring-1 focus:ring-purple-300 resize-none shadow-inner min-h-[100px]">${act.memo || ''}</textarea>
                                            <div class="flex justify-end space-x-2 mt-2.5">
                                                <button onclick="window.toggleMemo(event, '${act.id}', 'view')" class="px-3 py-1.5 text-xs font-medium text-gray-500 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">취소</button>
                                                <button onclick="window.saveInlineMemo(event, '${dayData.id}', '${act.id}')" class="px-3 py-1.5 text-xs font-bold text-white bg-purple-600 rounded-lg hover:bg-purple-700 shadow-sm transition-colors">저장하기</button>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                            item.innerHTML = `
                                ${iconHtml}
                                <div class="group cursor-pointer block p-4 rounded-2xl bg-white border shadow-sm hover:shadow-md transition-all duration-200 relative ${memoState ? 'border-purple-200 shadow-md' : 'border-gray-100 hover:border-purple-200'}" onclick="window.toggleMemo(event, '${act.id}', 'view')">
                                    ${memoBadge}
                                    <div class="flex justify-between items-center pr-2">
                                        <div class="flex-1">
                                            <div class="text-[11px] font-bold text-purple-600 mb-1 tracking-wide">${act.time}</div>
                                            <h4 class="font-bold text-gray-800 text-[15px] leading-tight">${act.title}</h4>
                                            ${act.desc ? `<p class="text-xs text-gray-500 mt-1.5 leading-relaxed break-keep">${act.desc}</p>` : ''}
                                        </div>
                                        <div class="flex-shrink-0 ml-3 transition-colors p-1.5 rounded-full ${memoState ? 'text-purple-600 bg-purple-50' : 'text-gray-200 bg-gray-50 group-hover:text-purple-600 group-hover:bg-purple-50'}">
                                            <i data-lucide="chevron-right" class="w-4 h-4 transition-transform duration-300 ${memoState ? 'rotate-90' : ''}"></i>
                                        </div>
                                    </div>
                                    ${memoHtml}
                                </div>
                            `;
                        }
                        timelineList.appendChild(item);
                    });
                    body.appendChild(timelineList);
                    if (isEditMode) {
                        const addBtn = document.createElement('button'); addBtn.className = "w-full mt-6 py-3 border-2 border-dashed border-gray-200 text-gray-500 font-bold rounded-xl hover:bg-slate-50 hover:border-indigo-300 hover:text-indigo-500 transition-colors flex items-center justify-center";
                        addBtn.innerHTML = `<i data-lucide="plus" class="w-5 h-5 mr-1"></i> 새 일정 추가`; addBtn.onclick = () => window.addActivity(dayData.id); body.appendChild(addBtn);
                    }
                    card.appendChild(body);
                }
                container.appendChild(card);
            });
            lucide.createIcons(); updateDday(); updateUndoButtonState();
        }

        window.onload = () => {
            updateDday();
            initFirebase();
            setTimeout(() => { if (document.getElementById('loading-screen').style.display !== 'none') hideLoadingScreen(); }, 8000);
        };
    </script>
</body>
</html>
