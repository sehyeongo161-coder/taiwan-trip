<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장금지원하민 대만여행</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { -webkit-font-smoothing: antialiased; background-color: #f8fafc; display: flex; justify-content: center; font-family: sans-serif; }
        button, a, div { -webkit-tap-highlight-color: transparent; outline: none; }
        .edit-input { width: 100%; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 4px; padding: 4px 6px; font-size: inherit; font-family: inherit; color: inherit; font-weight: inherit; transition: all 0.2s; }
        .edit-input:focus { outline: 2px solid #a855f7; border-color: transparent; background: white; }
        #loading-screen { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; color: #a855f7; font-weight: bold; flex-direction: column; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="animate-bounce mb-4 text-4xl">🇹🇼</div>
        <div>데이터 동기화 중...</div>
    </div>

    <div class="w-full max-w-md bg-[#FAFAFA] min-h-screen shadow-2xl relative pb-24 overflow-x-hidden">
        <header class="bg-gradient-to-br from-purple-100 via-violet-50 to-indigo-50 px-6 pt-12 pb-8 rounded-b-[40px] shadow-sm relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
            <div class="absolute top-10 -left-10 w-32 h-32 bg-indigo-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
            
            <div class="relative z-10 flex justify-between items-start">
                <div>
                    <div class="flex items-center text-purple-600 mb-2">
                        <i data-lucide="palmtree" class="w-[18px] h-[18px] text-purple-600 mr-2"></i>
                        <span class="text-sm font-semibold tracking-wider">GIRLS TAIWAN TRIP</span>
                        <span id="dday-badge" class="ml-2 px-2.5 py-0.5 bg-purple-600 text-white text-xs font-bold rounded-full shadow-sm">계산중...</span>
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-800 leading-tight">장금지원하민<br />대만 여행</h1>
                </div>
                <div class="flex items-center space-x-2 mt-2">
                    <button id="undo-btn" class="bg-white/80 p-2 rounded-full shadow-sm text-gray-400 hover:text-indigo-500 transition-colors backdrop-blur-sm disabled:opacity-30 disabled:hover:text-gray-400" onclick="window.undoAction()" disabled>
                        <i data-lucide="undo-2" class="w-5 h-5"></i>
                    </button>
                    <button id="edit-toggle-btn" class="bg-white/80 p-2 rounded-full shadow-sm text-gray-600 hover:text-purple-600 transition-colors backdrop-blur-sm" onclick="window.toggleEditMode()">
                        <i data-lucide="edit-3" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div id="edit-notice" class="hidden mt-4 text-xs font-bold text-purple-600 bg-white/70 px-3 py-2 rounded-lg backdrop-blur-sm shadow-sm text-center">
                ✏️ 편집 모드: 수정 완료 후 꼭 우측 상단 체크(✔) 버튼을 누르세요!
            </div>
        </header>

        <main class="px-5 -mt-4 relative z-20">
            <div id="itinerary-view">
                <!-- 여행 필수 체크 칸 삭제됨 -->
                <div id="trip-container"></div>
            </div>

            <div id="checklist-view" class="hidden pb-8">
                <div id="checklist-container" class="bg-white rounded-3xl shadow-sm border border-purple-50/50 p-5 mt-2"></div>
            </div>
        </main>

        <div class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-100 p-4 flex justify-around items-center text-gray-400 pb-6 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50">
            <button id="nav-itinerary" class="flex flex-col items-center text-purple-600 transition-colors" onclick="window.switchTab('itinerary')"><i data-lucide="calendar-days" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">일정표</span></button>
            <button id="nav-checklist" class="flex flex-col items-center hover:text-gray-800 transition-colors" onclick="window.switchTab('checklist')"><i data-lucide="list-todo" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">체크리스트</span></button>
            <a href="https://www.google.com/maps/search/타이베이+맛집" target="_blank" class="flex flex-col items-center hover:text-gray-800 transition-colors"><i data-lucide="map" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">지도 검색</span></a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC56qGPGXTnYBpQNdrdv2gt6TlkPvzTz-8",
            authDomain: "kitakyushu-trip.firebaseapp.com",
            projectId: "kitakyushu-trip",
            storageBucket: "kitakyushu-trip.firebasestorage.app",
            messagingSenderId: "883462812612",
            appId: "1:883462812612:web:ebb0479fcafb1c807f2a91"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const defaultData = [
            { id: 1, day: "1일차", date: "5월 16일", theme: "타이베이 도착 & 시먼딩 투어", activities: [
                { id: 101, time: "오후", title: "공항 ➔ 타이베이 시내", type: "bus", desc: "호텔 체크인 후 짐 맡기기", mapUrl: "", memo: "" },
                { id: 102, time: "오후", title: "시먼딩 거리 구경", type: "camera", desc: "행복당 밀크티 & 아종면선 곱창국수", mapUrl: "", memo: "" },
                { id: 103, time: "저녁", title: "시먼딩 마라훠궈", type: "utensils", desc: "무한리필 하겐다즈까지 뿌시기", mapUrl: "", memo: "" }
            ]},
            { id: 2, day: "2일차", date: "5월 17일", theme: "예스진지 택시투어 & 야시장", activities: [
                { id: 201, time: "오전", title: "예스진지 투어 출발", type: "bus", desc: "예류-스펀-진과스-지우펀", mapUrl: "", memo: "" },
                { id: 202, time: "오후", title: "스펀 천등 날리기 🏮", type: "heart", desc: "우리들의 소원 적어 날리기", mapUrl: "", memo: "" },
                { id: 203, time: "저녁", title: "지우펀 홍등가 야경", type: "camera", desc: "센과 치히로 배경지 구경", mapUrl: "", memo: "" }
            ]},
            { id: 3, day: "3일차", date: "5월 18일", theme: "용캉제 쇼핑 & 마지막 만찬", activities: [
                { id: 301, time: "오전", title: "용캉제 산책", type: "coffee", desc: "융캉우육면 먹고 망고빙수 후식", mapUrl: "", memo: "" },
                { id: 302, time: "오후", title: "까르푸 기념품 쇼핑", type: "shopping-bag", desc: "누가크래커 & 곰돌이 방향제", mapUrl: "", memo: "" },
                { id: 303, time: "오후", title: "공항으로 이동 ✈️", type: "plane", desc: "면세점 들렀다가 귀국!", mapUrl: "", memo: "" }
            ]}
        ];

        const defaultChecklist = [
            { id: "c1", text: "여권 & 항공권 확인", checked: false },
            { id: "c2", text: "이지카드(교통카드)", checked: false },
            { id: "c3", text: "대만 달러(TWD) 환전", checked: false }
        ];

        let tripData = [];
        let checklistData = [];
        let openDays = [1, 2, 3]; 
        let expandedMemos = {}; 
        let isEditMode = false;
        let currentTab = 'itinerary';
        let historyStack = []; 

        const getIconColor = (type) => {
            const colors = { plane: 'text-blue-500', bus: 'text-emerald-500', utensils: 'text-orange-500', 'shopping-bag': 'text-purple-500', camera: 'text-teal-500', heart: 'text-pink-500', coffee: 'text-amber-600' };
            return colors[type] || 'text-purple-400';
        };

        function hideLoadingScreen() { document.getElementById('loading-screen').style.display = 'none'; }

        async function saveData() {
            try {
                const docRef = doc(db, 'trips', 'taiwan-trip');
                await setDoc(docRef, { tripData: JSON.stringify(tripData), checklistData: JSON.stringify(checklistData) });
            } catch (e) { console.error(e); }
        }

        window.switchTab = function(tab) { currentTab = tab; render(); };

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            if (!isEditMode) saveData();
            render();
        };

        window.toggleDay = function(id) {
            if (openDays.includes(id)) openDays = openDays.filter(d => d !== id);
            else openDays.push(id);
            render();
        };

        window.toggleMemo = function(e, actId, state) {
            if (e) e.stopPropagation();
            expandedMemos[actId] = (expandedMemos[actId] === state) ? null : state;
            render();
        };

        window.saveInlineMemo = function(e, dayId, actId) {
            if (e) e.stopPropagation();
            const val = document.getElementById(`memo-input-${actId}`).value;
            const day = tripData.find(d => String(d.id) === String(dayId));
            const act = day.activities.find(a => String(a.id) === String(actId));
            if (act) { act.memo = val; saveData(); expandedMemos[actId] = 'view'; render(); }
        };

        window.toggleChecklistItem = function(id) {
            if (isEditMode) return;
            const item = checklistData.find(i => String(i.id) === String(id));
            if (item) { item.checked = !item.checked; saveData(); render(); }
        };

        function render() {
            document.getElementById('itinerary-view').style.display = currentTab === 'itinerary' ? 'block' : 'none';
            document.getElementById('checklist-view').style.display = currentTab === 'checklist' ? 'block' : 'none';
            
            const navItin = document.getElementById('nav-itinerary');
            const navCheck = document.getElementById('nav-checklist');
            navItin.className = `flex flex-col items-center ${currentTab === 'itinerary' ? 'text-purple-600' : 'text-gray-400'}`;
            navCheck.className = `flex flex-col items-center ${currentTab === 'checklist' ? 'text-purple-600' : 'text-gray-400'}`;

            const chkContainer = document.getElementById('checklist-container');
            let chkHtml = '<h2 class="text-xl font-bold text-gray-800 mb-5 flex items-center"><i data-lucide="list-todo" class="w-6 h-6 mr-2 text-purple-600"></i> 여행 체크리스트</h2><div class="space-y-3">';
            checklistData.forEach(item => {
                chkHtml += `<div class="flex items-center p-3 rounded-xl hover:bg-purple-50/50 cursor-pointer transition-colors ${item.checked ? 'bg-slate-50' : 'bg-white shadow-sm'}" onclick="window.toggleChecklistItem('${item.id}')">
                    <i data-lucide="${item.checked ? 'check-square' : 'square'}" class="w-6 h-6 mr-3 ${item.checked ? 'text-purple-400' : 'text-gray-300'} flex-shrink-0"></i>
                    <span class="${item.checked ? 'text-gray-400 line-through' : 'text-gray-800 font-medium'}">${item.text}</span>
                </div>`;
            });
            chkContainer.innerHTML = chkHtml + '</div>';

            const container = document.getElementById('trip-container');
            container.innerHTML = '';
            tripData.forEach(day => {
                const isOpen = openDays.includes(day.id);
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl shadow-sm border border-purple-50/50 mb-4 overflow-hidden";
                let html = `<div class="p-5 flex justify-between items-center cursor-pointer" onclick="window.toggleDay(${day.id})">
                    <div><span class="text-xs font-bold text-purple-600 bg-purple-100 px-3 py-1 rounded-full">${day.day}</span><h3 class="mt-2 text-lg font-bold text-gray-800">${day.theme}</h3></div>
                    <i data-lucide="${isOpen ? 'chevron-up' : 'chevron-down'}" class="text-gray-400"></i>
                </div>`;
                if (isOpen) {
                    html += `<div class="px-5 pb-6 pt-2 border-t border-purple-50/30"><div class="relative border-l-[1.5px] border-purple-100 ml-4 space-y-6 mt-4">`;
                    day.activities.forEach(act => {
                        const memoState = expandedMemos[act.id];
                        let memoHtml = memoState === 'view' ? `<div class="mt-3 pt-3 border-t border-gray-100" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center mb-1"><span class="text-xs font-bold text-gray-400">상세 메모</span><button onclick="window.toggleMemo(event, '${act.id}', 'edit')" class="p-1 hover:bg-purple-50 rounded"><i data-lucide="pencil" class="w-3.5 h-3.5 text-gray-400"></i></button></div>
                            <p class="text-[13px] text-gray-700 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100">${act.memo || '작성된 메모가 없습니다.'}</p>
                        </div>` : (memoState === 'edit' ? `<div class="mt-3 pt-3 border-t border-gray-100" onclick="event.stopPropagation()">
                            <textarea id="memo-input-${act.id}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-[13px] min-h-[100px]">${act.memo || ''}</textarea>
                            <div class="flex justify-end space-x-2 mt-2"><button onclick="window.toggleMemo(event, '${act.id}', 'view')" class="px-3 py-1 text-xs bg-gray-100 rounded-lg">취소</button><button onclick="window.saveInlineMemo(event, ${day.id}, ${act.id})" class="px-3 py-1 text-xs bg-purple-500 text-white rounded-lg">저장</button></div>
                        </div>` : '');
                        html += `<div class="relative pl-6">
                            <div class="absolute -left-[17px] top-0 w-[34px] h-[34px] rounded-full bg-white border border-purple-50 shadow-sm flex items-center justify-center z-10"><i data-lucide="${act.type}" class="w-4 h-4 ${getIconColor(act.type)}"></i></div>
                            <div class="p-4 rounded-2xl bg-white border border-gray-100 shadow-sm hover:border-purple-200 transition-all cursor-pointer" onclick="window.toggleMemo(event, '${act.id}', 'view')">
                                <div class="flex justify-between items-center"><div><div class="text-[11px] font-bold text-purple-600 mb-1">${act.time}</div><h4 class="font-bold text-gray-800 text-[15px]">${act.title}</h4>${act.desc ? `<p class="text-xs text-gray-500 mt-1">${act.desc}</p>` : ''}</div><i data-lucide="chevron-right" class="w-4 h-4 text-gray-200"></i></div>
                                ${memoHtml}
                            </div>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
                card.innerHTML = html; container.appendChild(card);
            });
            lucide.createIcons();
            const dday = new Date(2026, 4, 16);
            const diff = Math.ceil((dday - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
            document.getElementById('dday-badge').innerText = diff > 0 ? `D-${diff}` : (diff === 0 ? "D-Day 🇹🇼" : `D+${Math.abs(diff)}`);
        }

        // 실시간 동기화 및 초기 렌더링
        onSnapshot(doc(db, 'trips', 'taiwan-trip'), (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                const remoteTrip = JSON.parse(data.tripData || "[]");
                const remoteCheck = JSON.parse(data.checklistData || "[]");
                
                // 데이터가 아예 비어있는 경우(초기 상태) 기본 데이터 주입
                if (remoteTrip.length === 0) {
                    tripData = [...defaultData];
                    checklistData = [...defaultChecklist];
                    saveData();
                } else {
                    tripData = remoteTrip;
                    checklistData = remoteCheck;
                }
            } else {
                tripData = [...defaultData];
                checklistData = [...defaultChecklist];
                saveData();
            }
            render();
            hideLoadingScreen();
        });
    </script>
</body>
</html>
